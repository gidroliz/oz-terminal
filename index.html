<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020502">
  <title>OZ-TERMINAL // Взлом</title>
  <meta name="description" content="Ретро-терминал взлома в стиле постапокалипсиса: вскрывай замки отмычкой и подбирай пароли к терминалам.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://oz-terminal.vercel.app/">
  <meta property="og:site_name" content="OZ-TERMINAL">
  <meta property="og:title" content="OZ-TERMINAL // Взлом">
  <meta property="og:description" content="Вскрой замки отмычкой и подбери пароли к терминалам. Пять режимов, от новичка до бесконечного взлома.">
  <meta property="og:image" content="https://oz-terminal.vercel.app/og.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ru_RU">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OZ-TERMINAL // Взлом">
  <meta name="twitter:description" content="Вскрой замки отмычкой и подбери пароли к терминалам.">
  <meta name="twitter:image" content="https://oz-terminal.vercel.app/og.jpg">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='28' fill='%23040a04' stroke='%2333ff33' stroke-width='4'/><rect x='29' y='14' width='6' height='26' rx='3' fill='%2333ff33'/><circle cx='32' cy='44' r='5' fill='%2333ff33'/></svg>">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/ubuntu-mono-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ubuntu-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Тема и размер шрифта применяются до отрисовки, чтобы не было мигания
    try {
      const st = JSON.parse(localStorage.getItem('oz.settings') || '{}');
      if (st.theme) document.documentElement.dataset.theme = st.theme;
      if (st.large) document.documentElement.classList.add('large');
      if (st.crt === false) document.documentElement.classList.add('no-crt');
    } catch (e) {}
  </script>
</head>
<body>

<!-- ═════════ СТАРТОВЫЙ ЭКРАН ═════════ -->
<div class="modal-overlay visible" id="startOverlay">
  <div class="modal-box modal-green">
    <h2 data-i18n="start.title">OZ INDUSTRIES™ // ТЕРМИНАЛ ВЗЛОМА</h2>
    <div class="boot-log" id="bootLog" aria-hidden="true"></div>

    <details class="howto" id="howto">
      <summary data-i18n="start.howto">КАК ИГРАТЬ</summary>
      <div class="howto-title" data-i18n="howto.lock">ЗАМОК</div>
      <div class="howto-row"><span class="howto-key">1</span><span data-i18n-html="howto.1"></span></div>
      <div class="howto-row"><span class="howto-key">2</span><span data-i18n-html="howto.2"></span></div>
      <div class="howto-row"><span class="howto-key">3</span><span data-i18n-html="howto.3"></span></div>
      <div class="howto-title" data-i18n="howto.term">ТЕРМИНАЛ</div>
      <div class="howto-row"><span class="howto-key">4</span><span data-i18n-html="howto.4"></span></div>
      <div class="howto-row"><span class="howto-key">5</span><span data-i18n-html="howto.5"></span></div>
      <div class="howto-title" data-i18n="howto.reserve">РЕЗЕРВ</div>
      <div class="howto-row"><span class="howto-key">6</span><span data-i18n-html="howto.6"></span></div>
    </details>

    <div class="opt-group modes" role="radiogroup" aria-label="Режим">
      <span class="opt-label" data-i18n="start.mode">РЕЖИМ:</span>
      <button class="chip diff-btn" data-diff="easy" role="radio" data-i18n="mode.easy">НОВИЧОК</button>
      <button class="chip diff-btn" data-diff="normal" role="radio" data-i18n="mode.normal">ВЗЛОМЩИК</button>
      <button class="chip diff-btn" data-diff="hard" role="radio" data-i18n="mode.hard">МАСТЕР</button>
      <button class="chip diff-btn" data-diff="alarm" role="radio" data-i18n="mode.alarm">ТРЕВОГА</button>
      <button class="chip diff-btn" data-diff="endless" role="radio" data-i18n="mode.endless">БЕСКОНЕЧНЫЙ</button>
    </div>
    <div class="mode-desc" id="modeDesc"></div>
    <div class="opt-group" aria-label="Темы вопросов">
      <span class="opt-label" data-i18n="start.topics">ВОПРОСЫ:</span>
      <span class="topics" id="topics"></span>
    </div>

    <div class="opt-group" aria-label="Language">
      <span class="opt-label" data-i18n="start.lang">ЯЗЫК:</span>
      <span class="topics">
        <button class="chip lang-btn" data-lang="ru">РУССКИЙ</button>
        <button class="chip lang-btn" data-lang="en">ENGLISH</button>
      </span>
    </div>

    <div class="best-line" id="bestLine"></div>

    <button class="primary-btn" id="continueBtn" hidden>&gt; ПРОДОЛЖИТЬ ВЗЛОМ</button>
    <button class="primary-btn" id="startBtn" data-i18n="start.new">&gt; НОВЫЙ ВЗЛОМ</button>
    <button class="link-btn" id="lbLinkBtn" data-i18n="start.lbLink">[ ТАБЛИЦА РЕКОРДОВ ]</button>
    <button class="link-btn" id="statsLinkBtn" data-i18n="start.statsLink">[ СТАТИСТИКА И НАСТРОЙКИ ]</button>
  </div>
</div>

<!-- ═════════ ТЕРМИНАЛ ═════════ -->
<div class="pipboy">
  <div class="screen" id="screen">

    <div class="status-bar">
      <span class="status-name">OZ ST-3000</span>
      <span class="status-time" id="timer">00:00</span>
      <span class="status-btns">
        <button class="sound-btn" id="pauseBtn" data-i18n-title="btn.pauseTitle">❚❚</button>
        <button class="sound-btn" id="soundBtn" data-i18n-title="btn.soundTitle">♪ ВКЛ</button>
      </span>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="hack" role="tab" data-i18n="tab.hack">ВЗЛОМ</button>
      <button class="tab" data-tab="stat" role="tab" data-i18n="tab.stat">СТАТ</button>
      <button class="tab" data-tab="inv" role="tab" data-i18n="tab.inv">ИНВ</button>
      <button class="tab" data-tab="data" role="tab" data-i18n="tab.data">ДАННЫЕ</button>
      <button class="tab" data-tab="top" role="tab" data-i18n="tab.top">ТОП</button>
      <button class="tab" data-tab="cfg" role="tab" data-i18n="tab.cfg">НАСТР</button>
    </nav>

    <div class="panes">
      <!-- ВЗЛОМ -->
      <section class="pane active" data-pane="hack">
        <div class="lock-title" id="levelTitle">ЗАГРУЗКА ДАННЫХ...</div>
        <div class="level-indicator" id="levelIndicator"></div>

        <div class="lock-area" id="lockArea">
          <div class="kind-tag" id="kindTag" hidden></div>
          <div id="lockView">
            <div class="lock-canvas-wrap">
              <canvas id="lockCanvas" width="240" height="240" aria-label="Замок. Тяните влево и вправо, чтобы двигать отмычку."></canvas>
            </div>
            <div class="hint-text" id="hintText"></div>
          </div>
          <div id="termView" class="term-view" hidden></div>
        </div>

        <div class="action-panel" id="actionPanel">
          <div class="lamp" id="lamp"></div>
          <button class="hack-btn" id="hackBtn">
            <div class="hack-btn-bar" id="hackBar"></div>
            <span id="hackBtnText"></span>
          </button>
        </div>

        <div class="inventory">
          <div class="inv-left">
            <span class="inv-label" data-i18n="inv.label">ОТМЫЧКИ</span>
            <span class="pick-count" id="pickCount">0</span>
            <div class="wear" title="Состояние текущей отмычки">
              <div class="wear-bar" id="wearBar"></div>
            </div>
          </div>
          <button class="get-pin-btn scan-btn" id="scanBtn" data-i18n-title="btn.scanTitle">⌖ <span id="scanCount">0</span></button>
          <button class="get-pin-btn" id="getPinBtn" data-i18n-title="btn.reserveTitle"></button>
        </div>

        <div class="log" id="log" aria-live="polite"></div>
      </section>

      <!-- СТАТ -->
      <section class="pane" data-pane="stat"><div class="pane-scroll" id="statPane"></div></section>
      <!-- ИНВ -->
      <section class="pane" data-pane="inv"><div class="pane-scroll" id="invPane"></div></section>
      <!-- ДАННЫЕ -->
      <section class="pane" data-pane="data"><div class="pane-scroll" id="dataPane"></div></section>

      <!-- ТАБЛИЦА РЕКОРДОВ -->
      <section class="pane" data-pane="top">
        <div class="pane-scroll">
          <h3 data-i18n="lb.callsign">ПОЗЫВНОЙ</h3>
          <form class="callsign" id="callsignForm">
            <input type="text" id="callsignInput" maxlength="16" autocomplete="nickname" spellcheck="false">
            <button type="submit" class="chip" data-i18n="lb.save">СОХРАНИТЬ</button>
          </form>
          <div class="lb-msg" id="callsignMsg"></div>
          <h3 data-i18n="lb.title">ТАБЛИЦА РЕКОРДОВ</h3>
          <div class="lb-modes" id="lbModes"></div>
          <div class="lb-list" id="lbList"></div>
          <div class="lb-me" id="lbMe"></div>
          <button class="link-btn" id="lbRefresh" data-i18n="lb.refresh">[ ОБНОВИТЬ ]</button>
          <div class="muted setting-note" data-i18n="lb.note"></div>
        </div>
      </section>

      <!-- НАСТРОЙКИ -->
      <section class="pane" data-pane="cfg">
        <div class="pane-scroll">
          <h3 data-i18n="cfg.lang">ЯЗЫК</h3>
          <div class="setting">
            <span data-i18n="cfg.lang">ЯЗЫК</span>
            <span class="themes">
              <button class="chip lang-btn" data-lang="ru">RU</button>
              <button class="chip lang-btn" data-lang="en">EN</button>
            </span>
          </div>

          <h3 data-i18n="cfg.sound">ЗВУК</h3>
          <label class="setting">
            <span data-i18n="cfg.volume">ГРОМКОСТЬ</span>
            <input type="range" id="setVolume" min="0" max="100" step="5">
            <b id="setVolumeVal">80%</b>
          </label>
          <label class="setting"><span data-i18n="cfg.vibro">ВИБРАЦИЯ</span><input type="checkbox" id="setVibro"><i class="toggle"></i></label>

          <h3 data-i18n="cfg.screen">ЭКРАН</h3>
          <div class="setting">
            <span data-i18n="cfg.color">ЦВЕТ</span>
            <span class="themes" id="themes">
              <button class="chip theme-btn" data-theme="green" style="--sw:#33ff33" data-i18n="theme.green">ЗЕЛ</button>
              <button class="chip theme-btn" data-theme="amber" style="--sw:#ffb000" data-i18n="theme.amber">ЯНТ</button>
              <button class="chip theme-btn" data-theme="white" style="--sw:#e8f4ff" data-i18n="theme.white">БЕЛ</button>
              <button class="chip theme-btn" data-theme="cyan" style="--sw:#33e0ff" data-i18n="theme.cyan">ГОЛ</button>
            </span>
          </div>
          <label class="setting"><span data-i18n="cfg.crt">ЭФФЕКТЫ ЭЛТ</span><input type="checkbox" id="setCrt"><i class="toggle"></i></label>
          <label class="setting"><span data-i18n="cfg.typing">ЭФФЕКТ ПЕЧАТИ</span><input type="checkbox" id="setTyping"><i class="toggle"></i></label>
          <label class="setting"><span data-i18n="cfg.large">КРУПНЫЙ ШРИФТ</span><input type="checkbox" id="setLarge"><i class="toggle"></i></label>

          <h3 data-i18n="cfg.tutorial">ОБУЧЕНИЕ</h3>
          <button class="primary-btn secondary" id="tutorialResetBtn" data-i18n="cfg.tutorialReset">ПРОЙТИ ОБУЧЕНИЕ ЗАНОВО</button>
          <div class="muted setting-note" data-i18n="cfg.tutorialNote"></div>

          <h3 data-i18n="cfg.controls">УПРАВЛЕНИЕ</h3>
          <div class="kv keys">
            <div><span>← →</span><b data-i18n="keys.move"></b></div>
            <div><span data-i18n="keys.space"></span><b data-i18n="keys.turn"></b></div>
            <div><span data-i18n="keys.arrows"></span><b data-i18n="keys.term"></b></div>
            <div><span>X</span><b data-i18n="keys.mark"></b></div>
            <div><span>S</span><b data-i18n="keys.scan"></b></div>
            <div><span>R</span><b data-i18n="keys.reserve"></b></div>
            <div><span>P / ESC</span><b data-i18n="keys.pause"></b></div>
            <div><span>M</span><b data-i18n="keys.sound"></b></div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- ═════════ КОНТРОЛЬНЫЙ ВОПРОС ═════════ -->
<div class="modal-overlay" id="questionOverlay">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div class="modal-question-text" id="modalQ"></div>
    <div class="modal-options" id="modalOpts"></div>
    <div class="modal-result" id="modalResult"></div>
    <div class="modal-rewards" id="modalRewards" hidden>
      <button class="reward-btn" data-reward="pick"><span class="opt-key">1</span><span data-i18n="reward.pick">+1 ОТМЫЧКА</span></button>
      <button class="reward-btn" data-reward="scan"><span class="opt-key">2</span><span data-i18n="reward.scan">+1 СКАНЕР</span></button>
    </div>
    <button class="modal-continue-btn" id="modalContBtn" data-i18n="btn.continue">ПРОДОЛЖИТЬ</button>
  </div>
</div>

<!-- ═════════ ПАУЗА ═════════ -->
<div class="modal-overlay" id="pauseOverlay">
  <div class="modal-box modal-green pause-box">
    <h2 data-i18n="pause.title">ПАУЗА</h2>
    <div class="pause-info" id="pauseInfo"></div>
    <button class="primary-btn" id="resumeBtn" data-i18n="pause.resume">&gt; ПРОДОЛЖИТЬ</button>
    <button class="primary-btn secondary" id="pauseCfgBtn" data-i18n="pause.settings">НАСТРОЙКИ</button>
    <button class="primary-btn secondary" id="pauseMenuBtn" data-i18n="pause.menu">ВЫЙТИ В МЕНЮ</button>
    <div class="muted setting-note" data-i18n="pause.note"></div>
  </div>
</div>

<!-- ═════════ УЛУЧШЕНИЕ (бесконечный режим) ═════════ -->
<div class="modal-overlay" id="upgradeOverlay">
  <div class="modal-box">
    <h2 data-i18n="upg.title">УЛУЧШЕНИЕ</h2>
    <div class="upgrade-sub" data-i18n="upg.sub"></div>
    <div class="upgrade-opts" id="upgradeOpts"></div>
  </div>
</div>

<!-- ═════════ ФИНАЛ ═════════ -->
<div class="win-overlay" id="winOverlay">
  <canvas class="rain" id="rainCanvas"></canvas>
  <div class="win-box" id="winBox">
    <h2 id="endTitle">ДОСТУП РАЗРЕШЁН</h2>
    <div class="win-msg" id="endMsg"></div>
    <div class="stats" id="stats"></div>
    <div class="stage-stars" id="stageStars"></div>
    <div class="new-ach" id="newAch"></div>
    <div class="lb-box" id="lbBox"></div>
    <button class="primary-btn" id="restartBtn" data-i18n="btn.menu">&gt; В МЕНЮ</button>
  </div>
</div>

<!-- ═════════ ПОДСКАЗКА ОБУЧЕНИЯ ═════════ -->
<div class="coach" id="coach" hidden>
  <div class="coach-text" id="coachText"></div>
  <div class="coach-btns">
    <button class="link-btn" id="coachSkip" data-i18n="coach.skip">[ ПРОПУСТИТЬ ОБУЧЕНИЕ ]</button>
    <button class="link-btn coach-ok" id="coachOk" data-i18n="coach.ok">[ ПОНЯТНО ]</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="audio.js"></script>
<script src="words.js"></script>
<script src="questions.js"></script>
<script src="lore.js"></script>
<script src="terminal.js"></script>
<script src="script.js"></script>
</body>
</html>
